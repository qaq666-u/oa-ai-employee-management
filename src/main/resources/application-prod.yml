server:
  port: ${SERVER_PORT:8083}
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
    dashscope:
      enabled: ${DASHSCOPE_ENABLED:false}
      api-key: ${DASHSCOPE_API_KEY:}
      agent:
        enabled: false
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
file:
  upload-dir: ${OA_UPLOAD_DIR:/data/oa/uploads}
  base-url: ${OA_BASE_URL}
logging:
  file:
    name: ${OA_LOG_FILE:/var/log/oa/app.log}
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
  level:
    root: INFO
